    # TCE na Comunidade — controle de senhas: Next.js (server actions + SQLite), porta 3015 (repo tce_comunidade/apps/senhas)
    # Cole este bloco dentro do server { } de /etc/nginx/conf.d/gerenciahub.conf, antes de "# Block access to sensitive files".
    # Um único location sem barra final: cobre /tce-senhas e /tce-senhas/...; o Next (basePath /tce-senhas) cuida da barra
    # final (308 de /tce-senhas/ para /tce-senhas). Sem barra no proxy_pass: o Next precisa receber a URL completa.
    location /tce-senhas {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
