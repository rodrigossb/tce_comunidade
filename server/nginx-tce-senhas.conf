    # TCE na Comunidade — API do controle de senhas (Node + SQLite, porta 3015; repo tce_comunidade/server)
    # Cole este bloco dentro do server { } de /etc/nginx/conf.d/gerenciahub.conf, antes de "# Block access to sensitive files".
    location /tce-senhas/ {
        proxy_pass http://127.0.0.1:3015/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
