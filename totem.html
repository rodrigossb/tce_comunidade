<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TCE na Comunidade · Totem</title>
  <meta name="description" content="Totem de autoatendimento do TCE na Comunidade — 9ª Edição, Oiapoque e Distrito do Manga: programação, cursos, serviços e locais.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f3b9a">
  <link rel="icon" href="img/tce-mark.png">
  <link rel="stylesheet" href="css/base.css?v=13">
  <link rel="stylesheet" href="css/map.css?v=13">
  <link rel="stylesheet" href="css/totem.css?v=13">
</head>
<body>
  <!--
    Modo totem: tela vertical grande por toque (ex.: 42" em 1080×1920), uso em pé.
    Interface própria de quiosque: blocos grandes de escolha, abas no alto, listas com letras grandes,
    detalhe em painel de tela cheia, teclado na tela, QR Code fixo no rodapé e tela de descanso com a
    programação do dia (tv.html) que volta sozinha quando ninguém usa. Sem memória entre pessoas.
    Parâmetros na URL:
      ?local=jn|manga|sebrae|auditorio|iaparra local onde o totem está (padrão: jn)
      ?ocioso=90                            segundos sem toque até voltar à tela de descanso (padrão: 90)
      ?descanso=0                           sem tela de descanso: abre direto em "explorar" (e só volta ao início quando ocioso)
      ?t=HH:MM&d=AAAA-MM-DD                 simula data/hora (demonstração)
      ?app=https://…/                        endereço do app para os QR Codes (padrão: a mesma pasta)
      ?entrada=a1                           onde o totem está (acesso da planta), origem das rotas no mapa (padrão: a1)
    Tecla F: tela cheia.
  -->
  <div id="totem" class="tt"><div class="tt-loading">Carregando…</div></div>
  <script src="vendor/qrcode.js?v=13"></script>
  <script src="js/data.js?v=13"></script>
  <script src="js/shared.js?v=13"></script>
  <script src="js/icons.js?v=13"></script>
  <script src="js/map.js?v=13"></script>
  <script src="js/totem.js?v=13"></script>
</body>
</html>
